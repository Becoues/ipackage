services:
  ipackage:
    build: .
    image: ipackage:latest
    container_name: ipackage
    ports:
      # 宿主侧只绑 127.0.0.1（不暴露局域网）；容器内 HOST=0.0.0.0 由镜像注入
      - "127.0.0.1:8787:8787"
    environment:
      - IPACKAGE_DATA_DIR=/app/data
      # 也可在这里给 Key，但更推荐在网页「设置」里填（会持久化到 data 卷）：
      # - DEERAPI_API_KEY=sk-xxxx
    volumes:
      # 机器与包配置：直接编辑宿主上的 config/config.yaml 即生效
      - ./config:/app/config
      # 持久化：DeerAPI Key、baseUrl、模型降级链都存这里，重启不丢
      - ipackage-data:/app/data
      # 复用宿主 SSH（配置/密钥/known_hosts）。
      # 注意：OpenSSH 按系统用户库（getpwuid）找 home，容器内 root 即 /root，
      # 不认 $HOME 环境变量，所以必须挂到 /root/.ssh（rw 以便写 known_hosts）。
      - ${HOME}/.ssh:/root/.ssh
      # 若 config 里 IdentityFile 用了绝对路径（如 ~/Documents/xxx.pem），
      # 按该绝对路径再挂一份，使容器内同路径可命中：
      - ${HOME}/Documents:${HOME}/Documents:ro
    restart: unless-stopped

volumes:
  ipackage-data:
