# ipackage 配置。复制为 config/config.yaml 后按需修改。
#
# machines.host 取值：
#   - "local"        => 在本机直接执行命令
#   - "<ssh别名>"    => 复用 ~/.ssh/config 里的 Host（推荐，跳板机/密钥自动生效）
#   - "user@1.2.3.4" => 直连
# 需提前配置好免密（密钥/ssh-agent），不支持交互式密码。

machines:
  - { name: 本机, host: local }
  - { name: 阿里开发机, host: ali-dev }
  - { name: k8s, host: k8s }
  - { name: macmini, host: macmini }
  # - { name: data(AWS), host: data }
  # - { name: srv80-27, host: srv80-27, enabled: false }

packages:
  - id: claude-code
    label: Claude Code CLI
    manager: npm
    npmName: "@anthropic-ai/claude-code"
    repo: anthropics/claude-code
    versionCommand: "claude --version"
    updateCommand: "npm i -g @anthropic-ai/claude-code@latest"

  - id: lark-cli
    label: Lark CLI
    manager: npm
    npmName: "@larksuite/cli"             # npm 上的实际包名
    repo: larksuite/cli
    versionCommand: "lark-cli --version"  # 二进制名是 lark-cli
    updateCommand: "lark-cli update"      # 自更新，保留已授权配置，不直接覆盖
    # machineOverrides：按机器 host 覆盖命令（可选）。例：
    # machineOverrides:
    #   some-host:
    #     updateCommand: "..."
    # 提示：若本机 npm 全局目录归 root（更新报 EACCES），推荐一次性把目录改成自己所有，
    # 之后所有包在本机更新都无需 sudo：
    #   sudo chown -R $(whoami) /usr/local/lib/node_modules /usr/local/bin

  - id: codex
    label: Codex CLI
    manager: npm
    npmName: "@openai/codex"
    repo: openai/codex
    versionCommand: "codex --version"
    updateCommand: "codex update"   # standalone 安装自更新；npm 装的机器可 override 成 npm i -g

  - id: muninn
    label: Muninn
    manager: github
    repo: vast-enterprise/muninn   # 私有仓库，查最新版需要 GITHUB_TOKEN（见 .env.example）
    # 非 pip 安装：git clone + install.sh，clone 路径因机器而异。
    # 从 ~/.muninn/recall wrapper 里反解出 clone 路径，再读 __version__。
    # 找不到 wrapper 时明确报“未安装”，而不是 sed 读空路径报错。
    versionCommand: >-
      REPO=$(sed -n 's|.*PYTHONPATH="\(.*\)/client".*|\1|p' ~/.muninn/recall 2>/dev/null | head -1);
      [ -n "$REPO" ] || { echo "未安装 muninn（找不到 ~/.muninn/recall）" >&2; exit 1; };
      sed -n 's/^__version__ = "\(.*\)"/\1/p' "$REPO/client/muninn/__init__.py"
    updateCommand: >-
      REPO=$(sed -n 's|.*PYTHONPATH="\(.*\)/client".*|\1|p' ~/.muninn/recall 2>/dev/null | head -1);
      [ -n "$REPO" ] || { echo "未安装 muninn（找不到 ~/.muninn/recall）" >&2; exit 1; };
      make -C "$REPO" update

  - id: herdr
    label: Herdr
    manager: github
    repo: herdrdev/herdr            # https://herdr.dev ，GitHub releases/latest 即 stable 通道
    # install.sh 装到 ~/.local/bin，非交互 shell 未必在 PATH 里，显式补上
    versionCommand: 'PATH="$HOME/.local/bin:$PATH" herdr --version'
    updateCommand: 'PATH="$HOME/.local/bin:$PATH" herdr update'

  - id: magpie
    label: Magpie
    manager: github
    repo: yetone/magpie             # https://usemagpie.ai ，版本号形如 0.1.1734
    versionCommand: 'PATH="$HOME/.local/bin:$PATH" magpie --version'
    updateCommand: 'PATH="$HOME/.local/bin:$PATH" magpie update'

  - id: ncu
    label: npm-check-updates
    manager: npm
    npmName: "npm-check-updates"
    repo: raineorshine/npm-check-updates
    versionCommand: "ncu --version"
    updateCommand: "npm i -g npm-check-updates@latest"

  # PyPI 示例：
