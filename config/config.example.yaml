# ipackage 配置。复制为 config/config.yaml 后按需修改。
#
# machines.host 取值：
#   - "local"        => 在本机直接执行命令
#   - "<ssh别名>"    => 复用 ~/.ssh/config 里的 Host（推荐，跳板机/密钥自动生效）
#   - "user@1.2.3.4" => 直连
# 需提前配置好免密（密钥/ssh-agent），不支持交互式密码。

machines:
  - { name: 本机, host: local }
  - { name: 阿里开发机, host: ali-dev }
  - { name: k8s, host: k8s }
  - { name: macmini, host: macmini }
  # - { name: data(AWS), host: data }
  # - { name: srv80-27, host: srv80-27, enabled: false }

packages:
  - id: claude-code
    label: Claude Code CLI
    manager: npm
    npmName: "@anthropic-ai/claude-code"
    repo: anthropics/claude-code
    versionCommand: "claude --version"
    updateCommand: "npm i -g @anthropic-ai/claude-code@latest"

  - id: lark-cli
    label: Lark CLI
    manager: npm
    npmName: "@larksuite/cli"             # npm 上的实际包名
    repo: larksuite/cli
    versionCommand: "lark-cli --version"  # 二进制名是 lark-cli
    updateCommand: "lark-cli update"      # 自更新，保留已授权配置，不直接覆盖
    # machineOverrides：按机器 host 覆盖命令（可选）。例：
    # machineOverrides:
    #   some-host:
    #     updateCommand: "..."
    # 提示：若本机 npm 全局目录归 root（更新报 EACCES），推荐一次性把目录改成自己所有，
    # 之后所有包在本机更新都无需 sudo：
    #   sudo chown -R $(whoami) /usr/local/lib/node_modules /usr/local/bin

  - id: ncu
    label: npm-check-updates
    manager: npm
    npmName: "npm-check-updates"
    repo: raineorshine/npm-check-updates
    versionCommand: "ncu --version"
    updateCommand: "npm i -g npm-check-updates@latest"

  # PyPI 示例：
